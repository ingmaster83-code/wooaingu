name: Deploy Jekyll to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:         # 수동 실행
  schedule:
    - cron: '0 18 6 * *'     # 매월 6일 18:00 UTC = 7일 새벽 3시 KST (행정안전부 월말 기준 통계 공개 후)

permissions:
  contents: write            # 월별 수집 결과(_rawdata)를 커밋하기 위해
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 주민등록 인구 월간 갱신 (정기 실행·수동 실행에서만)
        if: github.event_name != 'push'
        run: |
          pip install requests
          bash scripts/refresh.sh
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}

      - name: 갱신 결과 커밋
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _rawdata/hh _rawdata/ingu_hist.json.gz _rawdata/ingu_dong.json _rawdata/ingu_beop.json _rawdata/ingu_meta.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: 주민등록 인구 월간 갱신 $(date +'%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
